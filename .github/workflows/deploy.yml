name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to Contabo (Alurd only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/alurd-backend
            git fetch origin main
            git reset --hard origin/main
            rm -rf node_modules
            npm ci
            npm run build
            pm2 restart alurd-api --update-env
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:4000/api/health; then
                echo
                exit 0
              fi
              sleep 1
            done
            echo "alurd-api health check failed"
            pm2 logs alurd-api --lines 40 --nostream || true
            exit 1
